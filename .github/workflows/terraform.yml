name: Vprofile IAC

on:
  push:
    branches:
      - main
      - stage
    paths:
      - 'terraform/**'
      - '.github/workflows/**'

  

jobs:
  terraform:
    name: Terraform CI/CD
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      TF_BUCKET_NAME: ${{ secrets.BUCKET_TF_STATE }}
      AWS_REGION: us-east-1

    steps:
     
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2️⃣ Configure AWS Credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

    
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      # ✅ ADD DEBUG STEP HERE
      - name: Debug Secret
        run: |
          if [ -z "$TF_BUCKET_NAME" ]; then
            echo "Secret is EMPTY"
          else
            echo "Secret is AVAILABLE"
          fi

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_BUCKET_NAME}" \
            -backend-config="key=terraform.tfstate" \
            -backend-config="region=${AWS_REGION}"

      # 5️⃣ Terraform Format Check
      - name: Terraform Format
        run: terraform fmt -check -recursive

      # 6️⃣ Terraform Validate
      - name: Terraform Validate
        run: terraform validate

      # 7️⃣ Terraform Plan
      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      # 8️⃣ Terraform Apply (Only on stage branch)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/stage'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Apply
        id: apple
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan -input=false -parallelism=1 planefile

      - name: Install Ingress controller
        if: steps.apple.outcome == 'success'
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.7.0/deploy/static/provider/aws/deploy.yaml